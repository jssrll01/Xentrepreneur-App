<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0%"  stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0f1e"/>
    </radialGradient>

    <linearGradient id="coinFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffe27a"/>
      <stop offset="45%"  stop-color="#f5b94a"/>
      <stop offset="100%" stop-color="#a86a12"/>
    </linearGradient>

    <linearGradient id="coinRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff4c0"/>
      <stop offset="55%"  stop-color="#d18a1e"/>
      <stop offset="100%" stop-color="#7a4a08"/>
    </linearGradient>

    <linearGradient id="coinShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="100"
        fill="none" stroke="white" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Coin -->
  <g filter="url(#softShadow)">
    <!-- Outer rim -->
    <circle cx="256" cy="256" r="170" fill="url(#coinRim)"/>
    <!-- Main face -->
    <circle cx="256" cy="256" r="150" fill="url(#coinFace)"/>
    <!-- Inner engraved ring -->
    <circle cx="256" cy="256" r="132"
            fill="none" stroke="#7a4a08" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="256" cy="256" r="122"
            fill="none" stroke="#fff4c0" stroke-opacity="0.55" stroke-width="2"/>
    <!-- Shine overlay -->
    <circle cx="256" cy="256" r="150" fill="url(#coinShine)" opacity="0.9"/>
  </g>

  <!-- £ symbol, embossed -->
  <g transform="translate(256 258)">
    <!-- Engraved shadow (offset dark) -->
    <text x="0" y="0"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="196" font-weight="700"
          text-anchor="middle" dominant-baseline="central"
          fill="#7a4a08" opacity="0.55"
          transform="translate(2 4)">£</text>
    <!-- Main glyph -->
    <text x="0" y="0"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="196" font-weight="700"
          text-anchor="middle" dominant-baseline="central"
          fill="#3a2405">£</text>
    <!-- Top highlight -->
    <text x="0" y="0"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="196" font-weight="700"
          text-anchor="middle" dominant-baseline="central"
          fill="#fff4c0" opacity="0.75"
          transform="translate(-1.5 -2)">£</text>
  </g>
</svg>
